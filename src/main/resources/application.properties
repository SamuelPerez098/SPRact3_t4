# Puerto para la Actividad 3 (evita conflicto con 8081 y 8083)
server.port=8084

# Conexión a tu base de datos en PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/figuras_db
spring.datasource.username=postgres
spring.datasource.password=123

# Borra y recrea las tablas cada vez que levantas el proyecto
spring.jpa.hibernate.ddl-auto=create-drop

# Asegura que el archivo data.sql se ejecute DESPUÉS de crear las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always